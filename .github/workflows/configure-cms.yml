name: Configure production CMS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect hosting configuration or apply the CMS connection and redeploy
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply

permissions:
  contents: read

concurrency:
  group: production-cms-setup
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify setup safeguards
        run: node --test scripts/configure-vercel-cms.test.mjs
      - name: Inspect or configure the verified production project
        run: node scripts/configure-vercel-cms.mjs
        env:
          CMS_SETUP_MODE: ${{ inputs.mode }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          MONGODB_URI: ${{ inputs.mode == 'apply' && secrets.MONGODB_URI || '' }}
